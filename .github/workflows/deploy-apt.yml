name: Deploy APT Repository to Pages

on:
  repository_dispatch:
    types: [update-apt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Web Source)
        uses: actions/checkout@v4

      - name: Fetch Latest Vidra Release Info
        id: fetch_release
        run: |
          LATEST_RELEASE=$(curl -s https://api.github.com/repos/chomusuke-mk/vidra/releases/latest)
          DEB_URL=$(echo "$LATEST_RELEASE" | jq -r '.assets[] | select(.name == "vidra-linux.deb") | .browser_download_url')
          
          if [ -z "$DEB_URL" ] || [ "$DEB_URL" == "null" ]; then
            echo "Failed to find vidra-linux.deb in the latest release."
            exit 1
          fi
          
          echo "DEB_URL=$DEB_URL" >> $GITHUB_OUTPUT

      - name: Download .deb Package
        run: |
          mkdir -p artifacts
          wget -qO artifacts/vidra-linux.deb "${{ steps.fetch_release.outputs.DEB_URL }}"

      - name: Setup reprepro and GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

          # Import GPG Key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Export Public Key for users
          gpg --armor --export > public.key

      - name: Generate APT Repository Structure
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Initialize reprepro config
          mkdir -p conf
          cat <<EOF > conf/distributions
          Origin: chomusuke-mk
          Label: Vidra APT Repository
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Official APT Repository for Vidra
          EOF

          # Inject DEB into repository
          reprepro -b . includedeb stable artifacts/vidra-linux.deb

          # Manually sign the Release files to avoid GPGME errors
          cd dists/stable
          rm -f InRelease Release.gpg
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -abs -o Release.gpg Release
          cd ../..

          # Cleanup unnecessary build directories before uploading
          rm -rf conf db artifacts

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
