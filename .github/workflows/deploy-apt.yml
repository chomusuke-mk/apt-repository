name: Deploy APT Repository to Pages

on:
  repository_dispatch:
    types: [update-apt]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Web Source)
        uses: actions/checkout@v7

      - name: Fetch and Download Latest Packages
        id: fetch_packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p artifacts

          # Add new repositories and their .deb asset names here
          # Format: "owner/repo:asset_name.deb"
          REPOS=(
            "chomusuke-mk/vidra:vidra-linux.deb"
            # Example: "chomusuke-mk/another-app:another-app_amd64.deb"
          )

          for entry in "${REPOS[@]}"; do
            REPO="${entry%%:*}"
            ASSET_NAME="${entry##*:}"
            
            echo "Fetching latest release for $REPO..."
            LATEST_RELEASE=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/latest")
            DEB_URL=$(echo "$LATEST_RELEASE" | jq -r ".assets[] | select(.name == \"$ASSET_NAME\") | .browser_download_url")
            
            if [ -n "$DEB_URL" ] && [ "$DEB_URL" != "null" ]; then
              echo "Downloading $ASSET_NAME from $DEB_URL..."
              wget -qO "artifacts/${REPO##*/}-${ASSET_NAME}" "$DEB_URL"
            else
              echo "Warning: Failed to find $ASSET_NAME in latest release of $REPO"
            fi
          done

      - name: Setup reprepro and GPG
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro

          # Import GPG Key
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Export Public Key for users
          gpg --armor --export > public.key

      - name: Generate APT Repository Structure
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          # Initialize reprepro config
          mkdir -p conf
          cat <<EOF > conf/distributions
          Origin: chomusuke-mk
          Label: Vidra APT Repository
          Codename: stable
          Architectures: amd64
          Components: main
          Description: Official APT Repository for Vidra
          EOF

          # Inject all DEBs into repository
          for pkg in artifacts/*.deb; do
            if [ -f "$pkg" ]; then
              echo "Injecting $pkg into repository..."
              reprepro -b . includedeb stable "$pkg"
            fi
          done

          # Manually sign the Release files to avoid GPGME errors
          cd dists/stable
          rm -f InRelease Release.gpg
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --clearsign -o InRelease Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" -abs -o Release.gpg Release
          cd ../..

          # Cleanup unnecessary build directories before uploading
          rm -rf conf db artifacts

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
